<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 마이링크</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: #f0f4fa;
      color: #243047;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 40px 24px;
      border-radius: 24px;
      background: white;
      text-align: center;
      box-shadow: 0 12px 40px #24304712;
    }
    .profile { font-size: 56px; }
    h1 { margin-bottom: 8px; font-size: 26px; }
    p { color: #64748b; line-height: 1.6; }
    nav { margin-top: 28px; }
    a {
      display: block;
      margin: 12px 0;
      padding: 16px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: #edf2ff;
      color: #334fa0;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover { background: #dce5ff; }
    a:focus-visible { outline: 3px solid #334fa0; }
    footer { margin-top: 28px; color: #64748b; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="profile">👋</div>
    <h1>yongs1284</h1>
    <p>안녕하세요! 나의 마이링크입니다.<br>
       자주 사용하는 링크를 모았습니다.</p>

    <nav aria-label="나의 링크">
      <a href="https://github.com/yongs1284">나의 GitHub</a>
      <a href="https://www.naver.com">네이버</a>
      <a href="https://www.youtube.com">유튜브</a>
    </nav>

    <footer>My Link · 나만의 링크 모음</footer>
  </main>
</body>
</html>
